[package]
name = "ps4-pkg-installer"
version = "0.1.0"
edition = "2021"
description = "Fast PS4 PKG and DLC batch extractor for ShadPS4"

[dependencies]
aes = "0.8"
anyhow = "1.0"
byteorder = "1.5"
cbc = "0.1"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
hmac = "0.12"
indicatif = "0.17"
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.10"
sha2 = "0.10"
walkdir = "2.5"
